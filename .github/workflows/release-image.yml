name: Build application release image

on:
  push:
    tags:
      - "locius-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example locius-v0.1.0)
        required: true
        type: string
      import_release:
        description: Import using a product callback (leave disabled for registry image sources)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  PRODUCT_KEY: ${{ vars.RELEASE_PRODUCT_KEY || 'locius' }}
  IMPORT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.import_release }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set GHCR image repository
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Validate release configuration
        env:
          RELEASE_IMPORT_URL: ${{ vars.RELEASE_IMPORT_URL }}
          RELEASE_IMPORT_TOKEN: ${{ secrets.RELEASE_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^locius-v[0-9][A-Za-z0-9._-]*$ && ${#VERSION} -le 128 ]]
          [[ "$PRODUCT_KEY" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          if [[ "$IMPORT_RELEASE" == true ]]; then
            : "${RELEASE_IMPORT_URL:?Set RELEASE_IMPORT_URL to the provisioner origin}"
            : "${RELEASE_IMPORT_TOKEN:?Set the product callback token}"
            [[ "$RELEASE_IMPORT_URL" =~ ^https://[^/?\#]+/?$ ]]
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Build application image locally on runner
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.fly \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE_REPOSITORY:$VERSION" \
            --load .

      - name: Smoke test image before publishing
        run: bash tests/docker_image_smoke.sh "$IMAGE_REPOSITORY:$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image and record immutable digest
        id: image
        run: |
          docker push "$IMAGE_REPOSITORY:$VERSION"
          image=$(docker image inspect "$IMAGE_REPOSITORY:$VERSION" --format '{{json .RepoDigests}}' |
            jq -er --arg prefix "$IMAGE_REPOSITORY@sha256:" '.[] | select(startswith($prefix))' | head -1)
          [[ "$image" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg product_key "$PRODUCT_KEY" \
            --arg version "$VERSION" \
            --arg image "$image" \
            '{product_key: $product_key, version: $version, image: $image, parent_version: null}' \
            > image-import.json

      - uses: actions/upload-artifact@v7
        with:
          name: image-manifest-${{ env.VERSION }}
          path: image-import.json

      - name: Import image into provisioner
        if: env.IMPORT_RELEASE == 'true'
        env:
          RELEASE_IMPORT_URL: ${{ vars.RELEASE_IMPORT_URL }}
          RELEASE_IMPORT_TOKEN: ${{ secrets.RELEASE_IMPORT_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer $RELEASE_IMPORT_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @image-import.json \
            "${RELEASE_IMPORT_URL%/}/api/images"

      - name: Publish summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo '### Locius / OMuse release image'
            echo "- Product: $PRODUCT_KEY"
            echo "- Version: $VERSION"
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $IMAGE"
            echo "- Import requested: $IMPORT_RELEASE"
          } >> "$GITHUB_STEP_SUMMARY"
