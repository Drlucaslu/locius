<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a1f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>OMuse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B7A5C'/%3E%3Ccircle cx='15.4' cy='16.9' r='7.4' stroke='white' stroke-width='3.2' fill='none'/%3E%3Ccircle cx='22' cy='10' r='2.6' fill='%23BFF3DE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/app.css">
<script>try{var t=localStorage.getItem('omuse_theme');if(t==='ink'||t==='paper')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div id="app">
  <aside id="nav">
    <div class="brand"><span class="logo">O</span><div><b>OMuse</b></div></div>
    <nav id="navlinks"></nav>
    <div class="nav-foot" id="navfoot"></div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单 Menu">☰</button>
      <h1 id="viewTitle">对话</h1>
      <div class="top-right">
        <span class="chip" id="modelChip" title="模型 Model">模型 …</span>
        <span class="chip shield" id="sentinelChip" title="Sentinel 哨兵">🛡 Sentinel</span>
        <button class="bell" id="approvalBell" aria-label="审批 Approvals"><span>审批</span><b id="approvalCount" hidden>0</b></button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="navBack" class="nav-back" hidden></div>
<div id="drawer" class="drawer" hidden>
  <div class="drawer-head"><h2>待审批 Approvals</h2><button class="icon-btn" id="drawerClose" aria-label="关闭">✕</button></div>
  <p class="muted small">由 Sentinel 独立发起，与对话分离。Agent 在你决定前会暂停。</p>
  <div id="drawerBody"></div>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script src="static/marked.min.js"></script>
<script src="static/purify.min.js"></script>
<script src="static/i18n.js"></script>
<script src="static/i18n_tw.js"></script>
<script src="static/app.js"></script>
</body>
</html>
